# 行业研究卡 v2 —— 纯研究口径，不含交易规则
# 字段说明见 schema 注释；加行业 = 加一张卡，不改代码。

schema: 2

cards:

- meta: {id: ai, name: AI/算力, chain: midstream, version: 1, updated: 2026-11-22,
         links: {upstream: [semi, resource], downstream: [consumer]}}
  drivers: [云厂商capex, 光模块出货, 国产算力订单]
  indicators:
    - {key: capex,   name: 北美四大云capex, layer: demand,    source: manual,    freq: quarterly, direction: up,   signal: {type: yoy, op: ">", value: 0.15}, weight: 0.35, fill_by: 财报季}
    - {key: opt_exp, name: 光模块出口同比,   layer: demand,    source: manual,    freq: monthly,   direction: up,   signal: {type: yoy, op: ">", value: 0.20}, weight: 0.25}
    - {key: tsmc,    name: 台积电月营收,     layer: price,     source: manual,    freq: monthly,   direction: up,   signal: {type: yoy, op: ">", value: 0.10}, weight: 0.20}
    - {key: idx,     name: 全指信息,         layer: price,     source: index,     code: sh000993, freq: daily, direction: up, signal: {type: momentum, window: 60, op: ">", value: 0}, weight: 0.20}
  verify:
    - {key: gm,  name: 通信设备毛利率, source: financial, freq: quarterly, direction: up}
    - {key: inv, name: 存货周转天数,   source: financial, freq: quarterly, direction: down}
  valuation: {index: sh000993, pe_window: 5y, weight: 0.15}
  thresholds: {start_rs60: 0.05, overheat_rs60: 0.30}
  invalidate:
    - 北美四大 capex 指引下调
    - 光模块出口同比连续 2 个月转负

- meta: {id: semi, name: 半导体, chain: upstream, version: 1, updated: 2026-11-22,
         links: {upstream: [resource], downstream: [ai, manufacture]}}
  drivers: [存储价格, 晶圆厂稼动率, 库存周期]
  indicators:
    - {key: dram,  name: DRAM现货价,   layer: price,     source: manual,    freq: weekly,  direction: up,   signal: {type: momentum, window: 4, op: ">", value: 0}, weight: 0.35}
    - {key: util,  name: 晶圆厂稼动率, layer: demand,    source: manual,    freq: monthly, direction: up,   signal: {type: level, op: ">", value: 0.80}, weight: 0.25}
    - {key: idx,   name: 科创50,       layer: price,     source: index,     code: sh000688, freq: daily, direction: up, signal: {type: momentum, window: 60, op: ">", value: 0}, weight: 0.25}
    - {key: inv,   name: 渠道库存周数, layer: inventory, source: manual,    freq: monthly, direction: down, signal: {type: level, op: "<", value: 8}, weight: 0.15}
  verify:
    - {key: gm,  name: 存储厂毛利率, source: financial, freq: quarterly, direction: up}
    - {key: inv, name: 库存周转天数, source: financial, freq: quarterly, direction: down}
  valuation: {index: sh000688, pe_window: 5y, weight: 0.15}
  thresholds: {start_rs60: 0.05, overheat_rs60: 0.35}
  invalidate:
    - DRAM 现货价连续 6 周下跌
    - 稼动率跌破 70%

